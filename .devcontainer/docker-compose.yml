version: '3.8'

services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached
      
    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Networks
    networks:
      # External Network
      - traefik
      # Internal Network
      - cgpe

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

    # Container Labels
    labels:
      # +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
      # Traefik Labels - see https://doc.traefik.io/traefik/routing/providers/docker/
      # Traefik Enable
      - "traefik.enable=true"
      # Docker Network
      - "traefik.docker.network=traefik"
      # Routing Rule
      - "traefik.http.routers.cgpe.rule=Host(`peereval.home.russfeld.me`)"
      # Change Port
      - "traefik.http.services.cgpe.loadbalancer.server.port=3000"
      # Enable TLS
      - "traefik.http.routers.cgpe.tls=true"
      # TLS Certificate Resolver
      - "traefik.http.routers.cgpe.tls.certresolver=letsencrypt"
      # +++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++

  db:
    image: postgres:latest
    restart: unless-stopped
    networks:
      - cgpe
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

volumes:
  postgres-data:

networks:
  cgpe:
    name: cgpe
    internal: true
  traefik:
    name: traefik
    external: true
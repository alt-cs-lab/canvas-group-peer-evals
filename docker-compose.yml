services:
  peerevals:
    build: .
    depends_on:
      - db
    environment:
      LOG_LEVEL: lti
      DB_HOST: db
      DB_PORT: 5432,
      DB_NAME: group_peer_evals_db
      DB_USER: username
      DB_PASSWORD: p@ssw0rd
      # require('crypto').randomBytes(64).toString('hex')
      SESSION_KEY: session_key_here_change_me
      SESSION_NAME: peer_eval_session
      # The 'trust proxy' setting can either be a boolean
      # (blanket trust any proxy if true, disabled if false)
      # or a specific ip address
      TRUST_PROXY: true
      LTI_CONSUMER_KEY: your_consumer_key_here
      LTI_SHARED_SECRET: your_shared_secret_here
      DOMAIN_NAME: https://peereval.yourdomain.edu
      CANVAS_ACCESS_TOKEN: your_canvas_access_token_here
      CANVAS_HOST: canvas.instructure.com
    ports:
      - "3000:3000"

  db:
    container_name: db
    image: postgres:latest
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: p@ssw0rd
      POSTGRES_DB: group_peer_evals_db

volumes:
  postgres-data: